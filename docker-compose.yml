services:
  web:
    build: .
    image: lab-report-analyzer:latest
    container_name: lab-report-analyzer
    restart: unless-stopped
    # cloudflared reaches the app through the shared external "web" network
    # (tunnel service URL: http://lab-report-analyzer:80).
    networks: [web]
    # Loopback only, for local checks with curl; never exposed to the network.
    ports:
      - "127.0.0.1:${HOST_PORT:-8085}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  web:
    external: true
