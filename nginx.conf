# Server config for the static export. Copied to /etc/nginx/conf.d/default.conf (http context).

# Hashes of the inline <script> tags Next.js emits, generated at build time by scripts/csp-hashes.mjs.
include /etc/nginx/csp-hashes.conf;

# Hashed build assets are immutable; everything else (HTML, RSC .txt payloads) must revalidate.
map $uri $cache_control {
    default                                          "no-cache";
    ~^/_next/static/                                 "public, max-age=31536000, immutable";
    ~\.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?)$   "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml text/x-component application/manifest+json;

    # Declared once at server level and never in a location block (nginx drops inherited
    # add_header directives as soon as a location declares its own).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
